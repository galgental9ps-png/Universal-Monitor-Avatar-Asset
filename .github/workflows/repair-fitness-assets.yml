name: Repair Fitness Assets HQ

on:
  push:
    paths:
      - '.github/workflows/repair-fitness-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Improve PNG quality and ground alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance

          ROOT = Path('src/UniversalMonitorAvatar/Assets')

          def improve(path: Path, sharpen_percent: int = 150):
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              alpha = im.getchannel('A')
              rgb = im.convert('RGB')

              # 2x supersampling smooths blocky edges without changing final dimensions.
              rgb = rgb.resize((w * 2, h * 2), Image.Resampling.LANCZOS)
              rgb = rgb.filter(ImageFilter.UnsharpMask(radius=1.4, percent=sharpen_percent, threshold=2))
              rgb = rgb.resize((w, h), Image.Resampling.LANCZOS)
              rgb = ImageEnhance.Sharpness(rgb).enhance(1.12)

              alpha = alpha.resize((w * 2, h * 2), Image.Resampling.LANCZOS)
              alpha = alpha.resize((w, h), Image.Resampling.LANCZOS)
              out = rgb.convert('RGBA')
              out.putalpha(alpha)
              return out

          idle_path = ROOT / 'Avatar' / 'Idle.png'
          actions_path = ROOT / 'Avatar' / 'Actions.png'
          scene_path = ROOT / 'MonitorScene' / 'MonitorScene.png'

          idle = improve(idle_path, 165)
          # Figur im PNG leicht nach unten setzen, damit die Füße auf der Bodenlinie stehen.
          shifted = Image.new('RGBA', idle.size, (0, 0, 0, 0))
          shifted.alpha_composite(idle, (0, 20))
          shifted.save(idle_path, 'PNG', optimize=True, compress_level=9)

          actions = improve(actions_path, 160)
          actions.save(actions_path, 'PNG', optimize=True, compress_level=9)

          scene = improve(scene_path, 145)
          scene.save(scene_path, 'PNG', optimize=True, compress_level=9)

          # Harte technische Kontrolle.
          expected = {
              idle_path: (1024, 1536),
              actions_path: (1536, 1024),
              scene_path: (1672, 941),
          }
          for path, size in expected.items():
              check = Image.open(path).convert('RGBA')
              assert check.size == size, (path, check.size, size)
              lo, hi = check.getchannel('A').getextrema()
              assert lo < 255 and hi > 0, (path, lo, hi)
              print(path, check.size, path.stat().st_size, 'alpha', (lo, hi))
          PY

      - name: Commit corrected PNGs
        shell: bash
        run: |
          git config user.name "galgental9ps-png"
          git config user.email "galgental9.ps@gmail.com"
          git add src/UniversalMonitorAvatar/Assets/Avatar/Idle.png
          git add src/UniversalMonitorAvatar/Assets/Avatar/Actions.png
          git add src/UniversalMonitorAvatar/Assets/MonitorScene/MonitorScene.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit."
            exit 0
          fi
          git commit -m "Assets: improve Fitnessstudio PNG quality and ground alignment"
          git push origin main
