name: Assemble Universal Asset Set

on:
  push:
    paths:
      - '.asset-upload/trigger.txt'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image support
        run: python3 -m pip install --quiet pillow
      - name: Assemble and validate UniversalMonitorAvatar assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64, json

          root = Path('.')
          staging = root / '.asset-upload'
          base = root / 'src' / 'UniversalMonitorAvatar' / 'Assets'
          targets = {
              'idle': (base/'Avatar'/'Idle.png', (1024,1536)),
              'actions': (base/'Avatar'/'Actions.png', (1536,1024)),
              'scene': (base/'MonitorScene'/'MonitorScene.png', (1672,941)),
              'bell': (base/'Klingel'/'MonitorBell.png', (1254,1254)),
          }
          verified=[]
          for key,(dest,dims) in targets.items():
              parts=sorted((staging/key).glob('part*.txt'))
              if not parts:
                  raise SystemExit(f'Missing staging data for {key}')
              raw=b''.join(base64.b64decode(p.read_text(encoding='utf-8').strip(),validate=True) for p in parts)
              image=Image.open(BytesIO(raw)).convert('RGBA')
              image=image.resize(dims,Image.Resampling.LANCZOS)
              dest.parent.mkdir(parents=True,exist_ok=True)
              image.save(dest,'PNG',optimize=True,compress_level=9)
              check=Image.open(dest).convert('RGBA')
              if check.size != dims:
                  raise SystemExit(f'{key}: wrong dimensions {check.size} != {dims}')
              lo,hi=check.getchannel('A').getextrema()
              if lo == 255 or hi == 0:
                  raise SystemExit(f'{key}: transparency check failed')
              verified.append(str(dest).replace('\\','/'))

          saying={'theme':'Fitnessstudio','line':'Bleib in Bewegung – die besten Ziele erreichst du Schritt für Schritt! 💪'}
          sp=base/'Sprüche'/'Abschiedsspruch.json'
          sp.parent.mkdir(parents=True,exist_ok=True)
          sp.write_text(json.dumps(saying,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          json.loads(sp.read_text(encoding='utf-8'))
          verified.append(str(sp).replace('\\','/'))

          fallback={
              'purpose':'Universelle Standardsprüche als Reserve, falls ein Asset-Set keinen eigenen Abschiedsspruch enthält.',
              'lines':[
                  'Bis gleich – ich bin beim nächsten Klingeln wieder da.',
                  'Ich bin kurz weg und beim nächsten Signal wieder zur Stelle.',
                  'Bis zum nächsten Mal – der Monitor hält solange die Stellung.',
                  'Ich verschwinde kurz hinter die Kulissen und bin gleich wieder da.',
                  'Für heute bin ich raus – bis zum nächsten Klingeln!'
              ]
          }
          fb=base/'Sprüche'/'Fallback.json'
          fb.write_text(json.dumps(fallback,ensure_ascii=False,indent=2),encoding='utf-8')
          verified.append(str(fb).replace('\\','/'))

          status={
              'targetSet':'src/UniversalMonitorAvatar/Assets',
              'theme':'Fitnessstudio',
              'success':True,
              'committedSha':'workflow-commit',
              'verifiedPaths':verified,
              'failedStep':'',
              'message':'Fitnessstudio-Asset-Set erzeugt und unter src/UniversalMonitorAvatar/Assets validiert.'
          }
          (root/'AssetAutomationStatus.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit asset set atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f src/UniversalMonitorAvatar/Assets/Avatar/.gitkeep
          rm -f src/UniversalMonitorAvatar/Assets/MonitorScene/.gitkeep
          rm -f src/UniversalMonitorAvatar/Assets/Klingel/.gitkeep
          git rm -rf .asset-upload
          git add src/UniversalMonitorAvatar/Assets AssetAutomationStatus.json
          git commit -m 'src/UniversalMonitorAvatar/Assets: Fitnessstudio Universal Asset-Set'
          git push origin HEAD:main
