name: Assemble Universal Asset Set (manual recovery only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate nested UniversalMonitorAvatar structure
        shell: bash
        run: |
          set -e
          BASE='src/UniversalMonitorAvatar/Assets/Assets 1'
          test -f "$BASE/Avatar/Idle.png"
          test -f "$BASE/Avatar/Actions.png"
          test -f "$BASE/MonitorScene/MonitorScene.png"
          test -f "$BASE/Klingel/MonitorBell.png"
          test -f "$BASE/Sprüche/Abschiedsspruch.json"
          echo 'Nested Assets/Assets 1 structure is present.'

# Daily asset generation is handled by the Universal Avatar Asset-Set automation.
# New sets must be created only under:
# src/UniversalMonitorAvatar/Assets/Assets 2/
# src/UniversalMonitorAvatar/Assets/Assets 3/
# ...
# Never write Avatar, MonitorScene, Klingel or Sprüche directly into the outer Assets folder.
