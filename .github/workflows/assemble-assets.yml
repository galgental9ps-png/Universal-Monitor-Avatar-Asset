name: Assemble Universal Asset Set

on:
  push:
    paths:
      - '.asset-upload/trigger.txt'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image support
        run: python3 -m pip install --quiet pillow
      - name: Assemble, upscale and validate assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64, json

          root=Path('.')
          targets={
              'idle':('Assets/Avatar/Idle.png',(1024,1536)),
              'actions':('Assets/Avatar/Actions.png',(1536,1024)),
              'scene':('Assets/MonitorScene/MonitorScene.png',(1672,941)),
              'bell':('Assets/Klingel/MonitorBell.png',(1254,1254)),
          }
          verified=[]
          for key,(dest,dims) in targets.items():
              parts=sorted((root/'.asset-upload'/key).glob('part*.txt'))
              if not parts:
                  raise SystemExit(f'Missing staging data for {key}')
              raw=base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts),validate=True)
              image=Image.open(BytesIO(raw)).convert('RGBA')
              image=image.resize(dims,Image.Resampling.LANCZOS)
              out=root/dest
              out.parent.mkdir(parents=True,exist_ok=True)
              image.save(out,'PNG',optimize=True,compress_level=9)
              check=Image.open(out).convert('RGBA')
              if check.size!=dims:
                  raise SystemExit(f'{key}: wrong dimensions {check.size} != {dims}')
              lo,hi=check.getchannel('A').getextrema()
              if lo==255 or hi==0:
                  raise SystemExit(f'{key}: transparency check failed')
              verified.append(dest)

          saying={'theme':'Fitnessstudio','line':'Bleib in Bewegung – die besten Ziele erreichst du Schritt für Schritt! 💪'}
          sp=root/'Assets/Sprüche/Abschiedsspruch.json'
          sp.parent.mkdir(parents=True,exist_ok=True)
          sp.write_text(json.dumps(saying,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          json.loads(sp.read_text(encoding='utf-8'))
          verified.append('Assets/Sprüche/Abschiedsspruch.json')
          status={
              'runAt':'2026-08-30T13:39:00+02:00','targetSet':'Assets','theme':'Fitnessstudio',
              'success':True,'committedSha':'workflow-commit','verifiedPaths':verified,
              'failedStep':'','message':'Fitnessstudio-Asset-Set erzeugt, geprüft und atomar auf main veröffentlicht.'
          }
          (root/'AssetAutomationStatus.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit asset set atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf .asset-upload
          git add Assets AssetAutomationStatus.json
          git commit -m 'Assets: Fitnessstudio Universal Asset-Set'
          git push origin HEAD:main
